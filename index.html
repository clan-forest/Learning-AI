<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>No-Key Learning AI</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#111827;
  color:white;
}
header{
  background:#020617;
  padding:18px;
  text-align:center;
  font-size:26px;
  font-weight:bold;
}
#chat{
  height:74vh;
  overflow-y:auto;
  padding:14px;
}
.msg{
  padding:14px;
  margin:10px 0;
  border-radius:14px;
  line-height:1.4;
  font-size:17px;
}
.user{
  background:#2563eb;
  text-align:right;
}
.bot{
  background:#374151;
}
.box{
  display:flex;
  gap:8px;
  padding:10px;
  background:#020617;
}
input{
  flex:1;
  padding:15px;
  font-size:16px;
  border:none;
  border-radius:10px;
}
button{
  padding:15px;
  border:none;
  border-radius:10px;
  background:#22c55e;
  color:white;
  font-weight:bold;
  font-size:16px;
}
.searchBtn{
  background:orange;
  color:black;
  margin-top:10px;
}
</style>
</head>

<body>

<header>🧠 No-Key Learning AI</header>

<div id="chat">
  <div class="msg bot">
    Hi! I work without an API key. I can answer simple things, remember what you teach me, and search the web when I do not know.
  </div>
</div>

<div class="box">
  <input id="input" placeholder="Ask me something...">
  <button onclick="send()">Send</button>
</div>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");

let brain = JSON.parse(localStorage.getItem("noKeyBrain")) || {
  "hi": "Hi! How can I help?",
  "hello": "Hello! What do you want to make?",
  "hey": "Hey! Ask me anything.",
  "who are you": "I am a no-API learning chatbot made with HTML, CSS, and JavaScript.",
  "what can you do": "I can chat, remember learned answers, search the web, and save my memory in this browser.",
  "html": "HTML is the structure of a website.",
  "css": "CSS controls how a website looks.",
  "javascript": "JavaScript makes websites interactive.",
  "chatgpt": "ChatGPT is a real AI model running on powerful servers. I am a smaller no-key browser chatbot.",
  "warrior cats": "Warrior Cats is a book series about wild cat clans."
};

function saveBrain(){
  localStorage.setItem("noKeyBrain", JSON.stringify(brain));
}

function addMessage(text,type){
  const div = document.createElement("div");
  div.className = "msg " + type;
  div.innerHTML = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function clean(text){
  return text.toLowerCase().trim().replace(/[?!.,]/g,"");
}

function similarity(a,b){
  a = clean(a);
  b = clean(b);

  let wordsA = a.split(" ");
  let wordsB = b.split(" ");
  let score = 0;

  for(let word of wordsA){
    if(wordsB.includes(word) || b.includes(word)){
      score++;
    }
  }

  return score;
}

function searchWeb(q){
  let url = "https://www.google.com/search?q=" + encodeURIComponent(q);
  window.open(url,"_blank");
}

function answer(question){
  let q = clean(question);

  if(q.startsWith("learn:")){
    let text = question.substring(6);
    let parts = text.split("=");

    if(parts.length < 2){
      return "Teach me like this:<br><b>learn: question = answer</b>";
    }

    let newQuestion = clean(parts[0]);
    let newAnswer = parts.slice(1).join("=").trim();

    brain[newQuestion] = newAnswer;
    saveBrain();

    return "I learned that.<br><br><b>" + newQuestion + "</b><br>" + newAnswer;
  }

  if(q === "show brain"){
    return "<pre>" + JSON.stringify(brain,null,2) + "</pre>";
  }

  if(q === "clear brain"){
    localStorage.removeItem("noKeyBrain");
    location.reload();
    return "Memory cleared.";
  }

  if(brain[q]){
    return brain[q];
  }

  let bestKey = "";
  let bestScore = 0;

  for(let key in brain){
    let score = similarity(q,key);

    if(score > bestScore){
      bestScore = score;
      bestKey = key;
    }
  }

  if(bestScore > 0){
    return brain[bestKey];
  }

  return `
    I do not know that yet.<br><br>
    <button class="searchBtn" onclick="searchWeb('${question.replace(/'/g,"")}')">Search the web</button>
    <br><br>
    After you find the answer, teach me like this:<br>
    <b>learn: ${q} = the answer goes here</b>
  `;
}

function send(){
  let text = input.value.trim();
  if(text === "") return;

  addMessage(text,"user");
  input.value = "";

  addMessage("Thinking...","bot");

  setTimeout(() => {
    let bots = document.querySelectorAll(".bot");
    bots[bots.length - 1].innerHTML = answer(text);
  },500);
}

input.addEventListener("keydown",function(e){
  if(e.key === "Enter") send();
});
</script>

</body>
</html>
